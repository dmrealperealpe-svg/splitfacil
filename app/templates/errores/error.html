{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
<div class="error-pagina">
  <div class="contenedor">
    <span class="error-codigo" aria-hidden="true">{{ codigo }}</span>
    <h1>{{ titulo }}</h1>
    <p>{{ mensaje }}</p>
    <div class="fila">
      {% if g.user %}
        <a class="boton boton-primario" href="{{ url_for('grupos.panel') }}">Ir a mis grupos</a>
      {% else %}
        <a class="boton boton-primario" href="{{ url_for('principal.inicio') }}">Volver al inicio</a>
        {% if codigo == 403 %}<a class="boton boton-secundario" href="{{ url_for('auth.entrar') }}">Iniciar sesión</a>{% endif %}
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
